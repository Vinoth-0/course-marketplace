# Spring Boot datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/course_marketplace?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=[YOUR_PASSWORD]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
# Secret must be at least 256-bit (32+ characters)
#create a strong secret key for production use
app.jwt.secret=e20d36353bf8154389ca32fd0e9198b9b265cfee5b26037ac412ae251f7e477a
app.jwt.expiration-ms=86400000
app.jwt.secret=your-super-secret-jwt-key-123456789

# Server port (optional, default is 8080)
server.port=8080

